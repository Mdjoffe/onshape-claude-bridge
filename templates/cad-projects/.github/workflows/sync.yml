name: Onshape sync

# Deliberately NOT triggered by pushes to main.
#
# The Free plan meters roughly 2500 API calls per user per year, about seven a
# day. Syncing on every push spends calls asking whether anything changed; at a
# few pushes a week that is a large fraction of the year's allowance consumed by
# polling. So the sync runs when you ask for it, and pull requests get a
# config check that costs nothing.
on:
  pull_request:
    paths: ['lib/**', 'projects/**']
  workflow_dispatch:
    inputs:
      direction:
        description: 'push (git -> Onshape) or pull (Onshape -> git)'
        default: push
        type: choice
        options: [push, pull]
      project:
        description: 'Path to one project (e.g. projects/test-bracket). Blank = all.'
        default: ''
        type: string
      assume_changed:
        description: 'Skip the comparison read: 1 call per file instead of 2'
        default: false
        type: boolean

concurrency:
  group: onshape-sync
  cancel-in-progress: false

jobs:
  # Costs nothing: parses every onshape.yml without touching the network.
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "git+https://github.com/Mdjoffe/onshape-claude-bridge.git@main"
      - run: onshape-bridge validate .

  sync:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed only so `pull` can commit exports back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check for credentials
        id: creds
        env:
          ONSHAPE_ACCESS_KEY: ${{ secrets.ONSHAPE_ACCESS_KEY }}
          ONSHAPE_SECRET_KEY: ${{ secrets.ONSHAPE_SECRET_KEY }}
        run: |
          if [ -n "$ONSHAPE_ACCESS_KEY" ] && [ -n "$ONSHAPE_SECRET_KEY" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo '::notice::ONSHAPE_ACCESS_KEY / ONSHAPE_SECRET_KEY are not set, so the sync was skipped. Add them under Settings > Secrets and variables > Actions.'
          fi

      - name: Install the bridge
        if: steps.creds.outputs.present == 'true'
        run: pip install "git+https://github.com/Mdjoffe/onshape-claude-bridge.git@main"

      # Free: catches a broken config before any call is spent on it.
      - name: Validate configs
        if: steps.creds.outputs.present == 'true'
        env:
          TARGET: ${{ inputs.project }}
        run: onshape-bridge validate "${TARGET:-.}"

      - name: Sync
        if: steps.creds.outputs.present == 'true'
        env:
          ONSHAPE_ACCESS_KEY: ${{ secrets.ONSHAPE_ACCESS_KEY }}
          ONSHAPE_SECRET_KEY: ${{ secrets.ONSHAPE_SECRET_KEY }}
          TARGET: ${{ inputs.project }}
          DIRECTION: ${{ inputs.direction }}
          ASSUME_CHANGED: ${{ inputs.assume_changed }}
        run: |
          set -euo pipefail
          extra=''
          if [ "$DIRECTION" = 'push' ] && [ "$ASSUME_CHANGED" = 'true' ]; then
            extra='--assume-changed'
          fi
          # The run's final line reports how many calls it spent -- copy it into
          # API_BUDGET.md so the ledger stays honest.
          onshape-bridge "$DIRECTION" "${TARGET:-.}" $extra

      - name: Commit exports
        if: steps.creds.outputs.present == 'true' && inputs.direction == 'pull'
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m 'Update Onshape exports'
            git push
          else
            echo 'exports already up to date'
          fi
